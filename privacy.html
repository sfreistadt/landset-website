// ─────── Tweaks (user preferences stored in localStorage) ─────────
function useTweaks() {
  const [t, setT] = useState(() => {
    try {
      const saved = localStorage.getItem("landsetPrivacyTweaks");
      return saved ? JSON.parse(saved) : {
        theme: "light",
        accent: "#5A7F5D",
        density: "comfortable",
        disclaimerProminence: "highlighted",
        showLegalBody: true,
      };
    } catch {
      return {
        theme: "light",
        accent: "#5A7F5D",
        density: "comfortable",
        disclaimerProminence: "highlighted",
        showLegalBody: true,
      };
    }
  });

  const setTweak = useCallback((key, val) => {
    setT((prev) => {
      const next = { ...prev, [key]: val };
      localStorage.setItem("landsetPrivacyTweaks", JSON.stringify(next));
      return next;
    });
  }, []);

  return [t, setTweak];
}

// ─────── Obfuscated email component ─────────
// Renders an email address with multiple layers of bot-resistance:
//   1. No mailto: in static markup (assembled on click in JS)
//   2. user / domain split into separate spans with hidden honeypot text between
//   3. The @ glyph is rendered separately from a CSS pseudo-element so the
//      string "privacy@landset.co" never appears as contiguous text in the DOM
//   4. Honeypot decoy address inserted with display:none — scrapers that
//      strip CSS will grab the wrong address
// Humans see "privacy@landset.co" and clicking opens their mail client.
function ObfuscatedEmail({ user = "privacy", domain = "landset.co", style, children, decoyOnly = false }) {
  const handleClick = (e) => {
    e.preventDefault();
    // Build the address only at click time, never in static markup.
    const at = String.fromCharCode(64);
    const addr = user + at + domain;
    window.location.href = "mai" + "lto:" + addr;
  };
  const honeypot = { display: "none" };
  const linkStyle = {
    cursor: "pointer",
    ...style,
  };
  // Reverse the FULL address in one span so the bidi-override applies
  // coherently to the whole string. Visually it reads "privacy@landset.co";
  // textContent of the span returns the reversed garbage.
  const fullReversed = (user + "\u0040" + domain).split("").reverse().join("");

  return (
    <a
      href="#contact"
      onClick={handleClick}
      style={linkStyle}
      data-em-u={btoa(user)}
      data-em-d={btoa(domain)}
    >
      {/* Honeypot decoy — invisible to humans, scrapers grab it first */}
      <span style={honeypot} aria-hidden="true">do-not-spam-NOSPAM-decoy@example.invalid</span>
      {/* Real address: one span, reversed, flipped back with CSS */}
      <span
        aria-hidden="true"
        style={{ unicodeBidi: "bidi-override", direction: "rtl" }}
      >
        {fullReversed}
      </span>
      {/* Trailing honeypot */}
      <span style={honeypot} aria-hidden="true">REMOVE-NOSPAM-TRAILER</span>
      {/* Screen-reader-only readable version */}
      <span style={{
        position: "absolute",

        clip: "rect(0,0,0,0)",
        whiteSpace: "nowrap",
      }}>
        {user} at {domain.replace(/\./g, " dot ")}
      </span>
    </a>
  );
}

// ─────── Text rendering (auto-obfuscates emails) ─────────
function renderInlineText(text, keyPrefix) {
  const re = /([a-z][a-z0-9._-]*)@(landset\.co)/gi;
  const parts = [];
  let last = 0;
  let m;
  let idx = 0;
  while ((m = re.exec(text)) !== null) {
    if (m.index > last) parts.push(text.slice(last, m.index));
    parts.push(
      <ObfuscatedEmail
        key={`${keyPrefix}-em-${idx++}`}
        user={m[1]}
        domain={m[2]}
        style={{ color: "inherit", textDecoration: "underline", textUnderlineOffset: 3 }}
      />
    );
    last = m.index + m[0].length;
  }
  if (last < text.length) parts.push(text.slice(last));
  return parts.length > 0 ? parts : text;
}

// ─────── Section body block renderer ─────────
function renderBlock(block, i, t, prominence) {
  if (typeof block === "string") {
    const content = renderInlineText(block, `b-${i}`);
    if (block.includes("\n")) {
      return (
        <p key={i} style={{ margin: "0 0 18px", whiteSpace: "pre-line" }}>
          {content}
        </p>
      );
    }
    return <p key={i} style={{ margin: "0 0 18px" }}>{content}</p>;
  }
  if (block.kind === "callout") {
    return <Callout key={i} block={block} t={t} prominence={prominence} />;
  }
  if (block.kind === "subhead") {
    return (
      <div key={i} style={{
        fontFamily: "var(--mono)",
        fontSize: 11,
        letterSpacing: ".14em",
        textTransform: "uppercase",
        color: t.inkFaint,
        margin: "24px 0 12px",
      }}>
        {block.text}
      </div>
    );
  }
  if (block.kind === "list") {
    return (
      <ul key={i} style={{
        margin: "0 0 18px",
        paddingLeft: 0,
        listStyle: "none",
        display: "grid",
        gap: 10,
      }}>
        {block.items.map((item, j) => (
          <li key={j} style={{
            display: "grid",
            gridTemplateColumns: "auto 1fr",
            gap: 14,
            alignItems: "start",
          }}>
            <span style={{
              fontFamily: "var(--mono)",
              fontSize: 12,
              color: t.inkFaint,
              paddingTop: 3,
              minWidth: 22,
            }}>
              {String(j + 1).padStart(2, "0")}
            </span>
            <span>{item}</span>
          </li>
        ))}
      </ul>
    );
  }
  return null;
}

      </svg>

      <SiteHeader theme={theme} accent={accent} />

      <div style={{
        display: "grid",
        gridTemplateColumns: "minmax(220px, 280px) 1fr",
        gap: 56,
        maxWidth: 1320,
        margin: "0 auto",
        padding: "0 48px",
      }}>
        <TOC
          sections={sections}
          t={theme}
          accent={accent}
          activeId={activeId}
          density={density}
          lastUpdated={window.PRIVACY_LAST_UPDATED}
        />

        <main style={{
          paddingTop: 56,
          paddingBottom: 96,
          minWidth: 0,
        }}>
          <header style={{ marginBottom: 16 }}>
            <h1 style={{
              fontSize: "clamp(44px, 6.5vw, 80px)",
              lineHeight: 0.98,
              letterSpacing: "-0.035em",
              margin: 0,
              color: theme.ink,
              fontWeight: 600,
              maxWidth: "16ch",
            }}>
              Privacy Policy.
            </h1>

            <p style={{
              marginTop: 28,
              fontSize: 18,
              lineHeight: 1.55,
              color: theme.inkSoft,
              maxWidth: "58ch",
            }}>
              How Landset collects, uses, and protects your information — written in plain English with full legal details. Your privacy matters to us.
            </p>

            <div style={{
              marginTop: 36,
              display: "flex",
              gap: 20,
              flexWrap: "wrap",
              fontFamily: "var(--mono)",
              fontSize: 11,
              letterSpacing: ".14em",
              textTransform: "uppercase",
              color: theme.inkFaint,
            }}>
              <span>Last updated · {window.PRIVACY_LAST_UPDATED}</span>
              <span style={{ color: theme.rule }}>·</span>
              <span>{sections.length} sections</span>
            </div>
          </header>

          {sections.map((s) => (
            <Section
              key={s.id}
              section={s}
              t={theme}
              density={density}
              prominence={prominence}
              showLegal={showLegal}
              accent={accent}
              isOpen={!!openMap[s.id]}
              onToggle={() => toggle(s.id)}
              registerRef={registerRef}
            />
          ))}
        </main>
      </div>

      <SiteFooter theme={theme} accent={accent} />

      <TweaksPanelComponent t={t} setTweak={setTweak} theme={theme} />
    </div>
  );
}

function TweaksPanelComponent({ t, setTweak, theme }) {
  return (
    <TweaksPanel title="Tweaks">
      <TweakSection label="Appearance">
        <TweakRadio
          label="Theme"
          value={t.theme}
          options={[
            { value: "light", label: "Light" },
            { value: "sepia", label: "Sepia" },
            { value: "dark", label: "Dark" },
          ]}
          onChange={(v) => setTweak("theme", v)}
        />
        <TweakColor
          label="Accent"
          value={t.accent}
          options={["#5A7F5D", "#3E5C40", "#7A6A3D", "#2B4F6F", "#171614"]}
          onChange={(v) => setTweak("accent", v)}
        />
        <TweakRadio
          label="Density"
          value={t.density}
          options={[
            { value: "compact", label: "Compact" },
            { value: "comfortable", label: "Comfort" },
            { value: "airy", label: "Airy" },
          ]}
          onChange={(v) => setTweak("density", v)}
        />
      </TweakSection>

      <TweakSection label="Content">
        <TweakToggle
          label="Show full legal text"
          value={t.showLegalBody}
          onChange={(v) => setTweak("showLegalBody", v)}
        />
      </TweakSection>
    </TweaksPanel>
  );
}

// Mount
window.PRIVACY_LAST_UPDATED = PRIVACY_LAST_UPDATED;
ReactDOM.render(<App />, document.getElementById("root"));
</script>
