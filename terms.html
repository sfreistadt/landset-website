// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', noDeckControls = false, children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  // Auto-inject a rail toggle when a <deck-stage> is on the page. The
  // toggle drives the deck's per-viewer _railVisible via window message;
  // state is mirrored from the same localStorage key the deck reads so
  // the control reflects reality across reloads. The mechanism is the
  // message — authors who want custom placement can post it directly
  // and pass noDeckControls to suppress this one.
  const hasDeckStage = React.useMemo(
    () => typeof document !== 'undefined' && !!document.querySelector('deck-stage'),
    [],
  );
  // deck-stage enables its rail in connectedCallback, but this panel can
  // mount before that element has upgraded. The initial read catches the
  // common case; the listener covers mounting first. (Older deck-stage.js
  // copies still wait for the host's __omelette_rail_enabled postMessage —
  // same listener handles those.)
  const [railEnabled, setRailEnabled] = React.useState(
    () => hasDeckStage && !!document.querySelector('deck-stage')?._railEnabled,
  );
  React.useEffect(() => {
    if (!hasDeckStage || railEnabled) return undefined;
    const onMsg = (e) => {
      if (e.data && e.data.type === '__omelette_rail_enabled') setRailEnabled(true);
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, [hasDeckStage, railEnabled]);
  const [railVisible, setRailVisible] = React.useState(() => {
    try { return localStorage.getItem('deck-stage.railVisible') !== '0'; } catch (e) { return true; }
  });
  const toggleRail = (on) => {
    setRailVisible(on);
    window.postMessage({ type: '__deck_rail_visible', on }, '*');
  };
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
          {hasDeckStage && railEnabled && !noDeckControls && (
            <TweakSection label="Deck">
              <TweakToggle label="Thumbnail rail" value={railVisible} onChange={toggleRail} />
            </TweakSection>
          )}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {

    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});
// Terms of Service — React app
// Renders the document, sticky TOC w/ scroll-spy, expand/collapse, tweaks panel.

const { useState, useEffect, useRef, useMemo, useCallback } = React;

// ───────── ObfuscatedEmail ─────────
// Renders an email address with multiple layers of bot-resistance:
//   1. No mailto: in static markup (assembled on click in JS)
//   2. user / domain split into separate spans with hidden honeypot text between
//   3. The @ glyph is rendered separately from a CSS pseudo-element so the
//      string "legal@landset.co" never appears as contiguous text in the DOM
//   4. Honeypot decoy address inserted with display:none — scrapers that
//      strip CSS will grab the wrong address
// Humans see "legal@landset.co" and clicking opens their mail client.
function ObfuscatedEmail({ user = "legal", domain = "landset.co", style, children, decoyOnly = false }) {
  const handleClick = (e) => {
    e.preventDefault();
    // Build the address only at click time, never in static markup.
    const at = String.fromCharCode(64);
    const addr = user + at + domain;
    window.location.href = "mai" + "lto:" + addr;
  };
  const honeypot = { display: "none" };
  const linkStyle = {
    cursor: "pointer",
    ...style,
  };
  // Reverse the FULL address in one span so the bidi-override applies
  // coherently to the whole string. Visually it reads "legal@landset.co";
  // textContent of the span returns the reversed garbage.
  const fullReversed = (user + "\u0040" + domain).split("").reverse().join("");

  return (
    <a
      href="#contact"
      onClick={handleClick}
      style={linkStyle}
      data-em-u={btoa(user)}
      data-em-d={btoa(domain)}
    >
      {/* Honeypot decoy — invisible to humans, scrapers grab it first */}
      <span style={honeypot} aria-hidden="true">do-not-spam-NOSPAM-decoy@example.invalid</span>
      {/* Real address: one span, reversed, flipped back with CSS */}
      <span
        aria-hidden="true"
        style={{ unicodeBidi: "bidi-override", direction: "rtl" }}
      >
        {fullReversed}
      </span>
      {/* Trailing honeypot */}

// ───────── Section callout (inline) ─────────
function Callout({ block, t, prominence }) {
  const tone = block.tone || "info";
  const isWarn = tone === "warning";
  const subtle = prominence === "subtle";

  const borderColor = subtle
    ? t.rule
    : isWarn ? t.calloutWarnBorder : t.calloutInfoBorder;
  const bg = subtle
    ? "transparent"
    : isWarn ? t.calloutWarnBg : t.calloutInfoBg;
  const ink = isWarn && !subtle ? t.calloutWarnInk : t.ink;

  return (
    <div style={{
      margin: "24px 0",
      borderLeft: `2px solid ${borderColor}`,
      background: bg,
      padding: "18px 22px",
    }}>
      {block.title ? (
        <div style={{
          fontFamily: "var(--mono)",
          fontSize: 11,
          letterSpacing: ".14em",
          textTransform: "uppercase",
          color: isWarn && !subtle ? t.calloutWarnInk : t.inkFaint,
          marginBottom: 8,
        }}>
          {isWarn ? "⚠  " : ""}{block.title}
        </div>
      ) : null}
      <div style={{
        color: ink,
        fontSize: "inherit",
        lineHeight: "inherit",
      }}>
        {typeof block.text === "string" ? renderInlineText(block.text, `cal-${block.title || ""}`) : block.text}
      </div>
    </div>
  );
}

function renderInlineText(text, keyPrefix) {
  // Auto-replace any literal email occurrence with the obfuscated component.
  const re = /([a-z][a-z0-9._-]*)@(landset\.co)/gi;
  const parts = [];
  let last = 0;
  let m;
  let idx = 0;
  while ((m = re.exec(text)) !== null) {
    if (m.index > last) parts.push(text.slice(last, m.index));
    parts.push(
      <ObfuscatedEmail
        key={`${keyPrefix}-em-${idx++}`}
        user={m[1]}
        domain={m[2]}
        style={{ color: "inherit", textDecoration: "underline", textUnderlineOffset: 3 }}
      />
    );
    last = m.index + m[0].length;
  }
  if (last < text.length) parts.push(text.slice(last));
  return parts.length > 0 ? parts : text;
}

// ───────── Section body block renderer ─────────
function renderBlock(block, i, t, prominence) {
  if (typeof block === "string") {
    const content = renderInlineText(block, `b-${i}`);
    // Handle simple newline-as-linebreak (used in address block)
    if (block.includes("\n")) {
      return (
        <p key={i} style={{ margin: "0 0 18px", whiteSpace: "pre-line" }}>
          {content}
        </p>
      );
    }
    return <p key={i} style={{ margin: "0 0 18px" }}>{content}</p>;
  }
  if (block.kind === "callout") {
    return <Callout key={i} block={block} t={t} prominence={prominence} />;
  }
  if (block.kind === "subhead") {
    return (
      <div key={i} style={{
        fontFamily: "var(--mono)",
        fontSize: 11,
        letterSpacing: ".14em",
        textTransform: "uppercase",
        color: t.inkFaint,
        margin: "24px 0 12px",
      }}>
        {block.text}
      </div>
    );
  }
  if (block.kind === "list") {
    return (
      <ul key={i} style={{
        margin: "0 0 18px",
        paddingLeft: 0,
        listStyle: "none",
        display: "grid",
        gap: 10,
      }}>
        {block.items.map((item, j) => (
          <li key={j} style={{
            display: "grid",
            gridTemplateColumns: "auto 1fr",
            gap: 14,
            alignItems: "start",
          }}>
            <span style={{
              fontFamily: "var(--mono)",
              fontSize: 12,
              color: t.inkFaint,
              paddingTop: 3,
              minWidth: 22,
            }}>
              {String(j + 1).padStart(2, "0")}
            </span>
            <span>{item}</span>
          </li>
        ))}
      </ul>
    );
  }
  return null;
}

            onClick={onToggle}
            style={{
              all: "unset",
              cursor: "pointer",
              fontFamily: "var(--mono)",
              fontSize: 11,
              letterSpacing: ".14em",
              textTransform: "uppercase",
              color: t.inkFaint,
              marginBottom: 16,
              display: "inline-flex",
              alignItems: "center",
              gap: 8,
              borderBottom: `1px dashed ${t.rule}`,
              paddingBottom: 4,
            }}
            aria-expanded={isOpen}
          >
            <span style={{
              display: "inline-block",
              width: 10,
              transform: isOpen ? "rotate(90deg)" : "rotate(0deg)",
              transition: "transform .18s ease",
            }}>›</span>
            {isOpen ? "Hide legal text" : "Show full legal text"}
          </button>

          {isOpen ? (
            <div>
              {section.body.map((block, i) => renderBlock(block, i, t, prominence))}
            </div>
          ) : null}
        </div>
      ) : null}
    </section>
  );
}

// ───────── TOC sidebar w/ scroll-spy ─────────
function TOC({ sections, t, accent, activeId, density, lastUpdated, effective }) {
  return (
    <aside style={{
      position: "sticky",
      top: 80,
      alignSelf: "start",
      maxHeight: "calc(100vh - 100px)",
      paddingTop: 40,
      paddingBottom: 32,
      paddingRight: 32,
      borderRight: `1px solid ${t.rule}`,
      display: "flex",
      flexDirection: "column",
      gap: 24,
      overflowY: "auto",
    }}>
      {/* Doc metadata */}
      <div style={{
        display: "grid",
        gap: 6,
        fontFamily: "var(--mono)",
        fontSize: 10.5,
        letterSpacing: ".14em",
        textTransform: "uppercase",
        color: t.inkFaint,
      }}>
        <div style={{ color: t.ink, fontWeight: 500 }}>Terms of Service</div>
        <div>Effective {effective}</div>
        <div>Updated {lastUpdated}</div>
      </div>

      {/* TOC list */}
      <nav style={{
        display: "grid",
        gap: 2,
        marginTop: 4,
        paddingRight: 4,
      }}>
        <div style={{
          fontFamily: "var(--mono)",
          fontSize: 10.5,
          letterSpacing: ".14em",
          textTransform: "uppercase",
          color: t.inkFaint,
          marginBottom: 8,
        }}>
          Contents
        </div>
        {sections.map((s) => {
          const isActive = s.id === activeId;
          return (
            <a
              key={s.id}
              href={`#${s.id}`}
              onClick={(e) => {
                e.preventDefault();
                const el = document.getElementById(s.id);
                if (el) {
                  el.scrollIntoView({ behavior: "smooth", block: "start" });
                  history.replaceState(null, "", `#${s.id}`);
                }
              }}
              style={{
                display: "grid",
                gridTemplateColumns: "20px 1fr",
                gap: 12,
                padding: "6px 0",
                textDecoration: "none",
                color: isActive ? t.ink : t.inkSoft,
                borderLeft: `2px solid ${isActive ? accent : "transparent"}`,
                paddingLeft: 12,
                marginLeft: -14,
                transition: "color .15s ease, border-color .15s ease",
              }}
            >
              <span style={{
                fontFamily: "var(--mono)",
                fontSize: 11,
                color: isActive ? accent : t.inkFaint,
                paddingTop: 3,
              }}>
                {s.letter}
              </span>
              <span style={{
                fontSize: 13.5,
                lineHeight: 1.35,
                fontWeight: isActive ? 500 : 400,
              }}>
                {s.label}
              </span>
            </a>
          );
        })}
      </nav>
    </aside>
  );
}

// ───────── Main App ─────────
function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const theme = THEMES[t.theme] || THEMES.light;
  const density = DENSITY[t.density] || DENSITY.comfortable;
  const accent = t.accent;
  const prominence = t.disclaimerProminence;
  const showLegal = t.showLegalBody;

  const sections = window.TERMS_SECTIONS;
  const [openMap, setOpenMap] = useState(() => {
    const m = {};
    sections.forEach((s) => { m[s.id] = true; });
    return m;
  });

  const toggle = (id) => setOpenMap((m) => ({ ...m, [id]: !m[id] }));

  // Scroll-spy
  const refMap = useRef({});
  const registerRef = useCallback((id, el) => { refMap.current[id] = el; }, []);
  const [activeId, setActiveId] = useState(sections[0].id);
  useEffect(() => {
    const observer = new IntersectionObserver(
      (entries) => {
        // Pick the topmost section that is currently intersecting
        const visible = entries.filter((e) => e.isIntersecting);
        if (visible.length > 0) {
          // Sort by top position
          visible.sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);
          setActiveId(visible[0].target.id);
        }
      },
      {
        rootMargin: "-10% 0px -70% 0px",
        threshold: 0,
      }
    );
    Object.values(refMap.current).forEach((el) => el && observer.observe(el));
    return () => observer.disconnect();
  }, [sections]);

    document.body.style.background = theme.bg;
    document.body.style.color = theme.ink;

            <path d="M3.4566 75.3429L39.9922 53.8981C42.655 52.3352 46.0094 54.2504 46.0169 57.3381L46.4946 253.638C46.4979 255.026 47.2207 256.314 48.4042 257.039L167.998 330.344C170.589 331.932 170.532 335.716 167.895 337.226L130.375 358.707C129.118 359.426 127.571 359.41 126.329 358.666L1.94209 284.037C0.737228 283.314 0 282.012 0 280.607V81.3798C0 78.8969 1.31528 76.5998 3.4566 75.3429Z" fill="currentColor" />

        margin: "0 auto",

        <TOC
          sections={sections}
          t={theme}
          accent={accent}
          activeId={activeId}
          density={density}
          lastUpdated={window.TERMS_LAST_UPDATED}
          effective={window.TERMS_EFFECTIVE}
        />

        <main style={{
          paddingTop: 56,
          paddingBottom: 96,
          minWidth: 0,
        }}>
          {/* Document header */}
          <header style={{ marginBottom: 16 }}>
            <h1 style={{
              fontSize: "clamp(44px, 6.5vw, 80px)",
              lineHeight: 0.98,
              letterSpacing: "-0.035em",
              margin: 0,
              color: theme.ink,
              fontWeight: 600,
              maxWidth: "16ch",
            }}>
              Terms of Service.
            </h1>

            <p style={{
              marginTop: 28,
              fontSize: 18,
              lineHeight: 1.55,
              color: theme.inkSoft,
              maxWidth: "58ch",
            }}>
              The rules of the road for using Landset — written in plain English up top, with the full legal text underneath. Every Landset Brief is an informational starting point, never a substitute for a licensed inspection, attorney, or your own diligence.
            </p>

            <HeroDisclaimer t={theme} prominence={prominence} />

            <div style={{
              marginTop: 36,
              display: "flex",
              gap: 20,
              flexWrap: "wrap",
              fontFamily: "var(--mono)",
              fontSize: 11,

              <span>Last updated · {window.TERMS_LAST_UPDATED}</span>

// ───────── Tweaks Panel ─────────
function TweaksPanelComponent({ t, setTweak, theme }) {
  return (
    <TweaksPanel title="Tweaks">
      <TweakSection label="Appearance">
        <TweakRadio
          label="Theme"
          value={t.theme}
          options={[
            { value: "light", label: "Light" },
            { value: "sepia", label: "Sepia" },
            { value: "dark", label: "Dark" },
          ]}
          onChange={(v) => setTweak("theme", v)}
        />
        <TweakColor
          label="Accent"
          value={t.accent}
          options={["#5A7F5D", "#3E5C40", "#7A6A3D", "#2B4F6F", "#171614"]}
          onChange={(v) => setTweak("accent", v)}
        />
        <TweakRadio
          label="Density"
          value={t.density}
          options={[
            { value: "compact", label: "Compact" },
            { value: "comfortable", label: "Comfort" },
            { value: "airy", label: "Airy" },
          ]}
          onChange={(v) => setTweak("density", v)}
        />
      </TweakSection>

      <TweakSection label="Content">
        <TweakRadio
          label="Disclaimer prominence"
          value={t.disclaimerProminence}
          options={[
            { value: "subtle", label: "Subtle" },
            { value: "highlighted", label: "Marked" },
            { value: "aggressive", label: "Loud" },
          ]}
          onChange={(v) => setTweak("disclaimerProminence", v)}
        />
        <TweakToggle
          label="Show full legal text"
          value={t.showLegalBody}
          onChange={(v) => setTweak("showLegalBody", v)}
        />
      </TweakSection>
    </TweaksPanel>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

<!-- Google Analytics Event Tracking -->
<script>
  (function() {
    // Track clicks on "Get early access" links
    document.addEventListener('click', function(e) {
      const target = e.target.closest('a[href*="early-access"]');
      if (target) {
        const location = target.closest('header') ? 'navigation' : 'unknown';

        gtag('event', 'get_early_access_click', {
          'event_category': 'engagement',
          'event_label': location,
          'location': location,
          'page': 'terms'
        });
      }
    });
  })();
</script>
