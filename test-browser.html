<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Landset Browser Test</title>
  <style>
    body { font-family: monospace; padding: 40px; max-width: 800px; margin: 0 auto; }
    .test { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
    .pass { background: #d4edda; border-color: #c3e6cb; }
    .fail { background: #f8d7da; border-color: #f5c6cb; }
    h1 { margin-bottom: 30px; }
  </style>
</head>
<body>
  <h1>Landset Browser Compatibility Test</h1>
  <div id="results"></div>

  <script>
    const results = document.getElementById('results');
    const tests = [];

    function addTest(name, pass, message) {
      tests.push({ name, pass, message });
    }

    // Test 1: Can parse JSON from template
    try {
      const templateEl = document.querySelector('script[type="__bundler/template"]');
      if (templateEl) {
        const jsonStr = templateEl.textContent.trim();
        const parsed = JSON.parse(jsonStr);
        addTest('JSON Parsing', true, `Successfully parsed ${jsonStr.length} chars → ${parsed.length} chars HTML`);
      } else {
        addTest('JSON Parsing', false, 'No bundler template found - redirecting to actual test...');
        window.location.href = '/';
      }
    } catch (e) {
      addTest('JSON Parsing', false, `Error: ${e.message} at position ${e.pos || 'unknown'}`);
    }

    // Test 2: Check browser info
    addTest('Browser', true, navigator.userAgent);

    // Test 3: JSON support
    try {
      JSON.parse('{"test": true}');
      addTest('JSON.parse', true, 'Native JSON support available');
    } catch (e) {
      addTest('JSON.parse', false, 'JSON.parse not available');
    }

    // Test 4: Fetch from live site
    fetch('/')
      .then(r => r.text())
      .then(html => {
        if (html.includes('Error unpacking:') && !html.includes('<h1 class="display">')) {
          addTest('Live Site', false, 'Page shows error unpacking message');
        } else if (html.includes('2.3+')) {
          addTest('Live Site', true, 'Latest content (2.3M permits) is live');
        } else {
          addTest('Live Site', false, 'Old content detected');
        }
        renderResults();
      })
      .catch(e => {
        addTest('Live Site', false, `Fetch failed: ${e.message}`);
        renderResults();
      });

    function renderResults() {
      results.innerHTML = tests.map(t => `
        <div class="test ${t.pass ? 'pass' : 'fail'}">
          <strong>${t.pass ? '✓' : '✗'} ${t.name}</strong><br>
          <small>${t.message}</small>
        </div>
      `).join('');
    }

    // Render initial results (before fetch completes)
    renderResults();
  </script>

  <!-- Try to load the bundler template from the main page -->
  <script>
    fetch('/index.html')
      .then(r => r.text())
      .then(html => {
        const match = html.match(/<script type="__bundler\/template">\s*(".*?")\s*<\/script>/s);
        if (match) {
          const script = document.createElement('script');
          script.type = '__bundler/template';
          script.textContent = match[1];
          document.body.appendChild(script);
          console.log('Bundler template loaded');
        }
      });
  </script>
</body>
</html>
